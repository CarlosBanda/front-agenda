server {
  listen 80;
  server_name _;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Reverse proxy to the NestJS API (no global prefix). The trailing slash on
  # proxy_pass strips /agenda-api, so /agenda-api/auth/login -> /auth/login.
  location /agenda-api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  location /agenda/assets/ {
    root /usr/share/nginx/html;
    expires 1y;
  }

  location /agenda/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /agenda/index.html;
  }

  location = / {
    return 301 /agenda/;
  }
}
